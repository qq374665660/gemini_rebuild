<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web文件管理试用 - {{ project.name }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'core/css/design-system.css' %}?v=2.0">
    <link rel="stylesheet" href="{% static 'core/css/navigation.css' %}?v=3.0">
    <link rel="stylesheet" href="{% static 'core/css/layout.css' %}?v=2.0">
    <link rel="stylesheet" href="{% static 'core/css/components.css' %}?v=2.0">
    <link rel="stylesheet" href="{% static 'core/vendor/fontawesome/css/all.min.css' %}?v=6.0.0">
    <style>
        .trial-shell {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 16px;
        }
        .panel {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
        }
        .panel h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .tree-list,
        .tree-list ul {
            list-style: none;
            padding-left: 18px;
            margin: 0;
        }
        #treeContainer > .tree-list {
            padding-left: 0;
        }
        #treeContainer {
            max-height: calc(100vh - 280px);
            min-height: 180px;
            overflow: auto;
            padding: 4px 2px 8px;
        }
        .tree-help {
            margin: 8px 0 4px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }
        .tree-item {
            margin: 2px 0;
        }
        .tree-row {
            display: flex;
            align-items: center;
            min-width: max-content;
            gap: 2px;
        }
        .tree-toggle,
        .tree-toggle-placeholder {
            width: 24px;
            height: 26px;
            flex: 0 0 24px;
        }
        .tree-toggle {
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            padding: 0;
        }
        .tree-toggle:hover {
            background: #eef2ff;
            color: #1d4ed8;
        }
        .tree-folder-btn {
            border: none;
            background: transparent;
            color: #1f2937;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-align: left;
            white-space: nowrap;
        }
        .tree-folder-btn:hover,
        .tree-file-btn:hover {
            background: #f1f5f9;
        }
        .tree-folder-btn.active {
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: 600;
        }
        .tree-folder-meta {
            font-size: 12px;
            color: #64748b;
            font-weight: 400;
        }
        .tree-folder-meta.is-empty {
            color: #94a3b8;
        }
        .tree-file-btn {
            border: none;
            background: transparent;
            color: #334155;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-align: left;
            white-space: nowrap;
        }
        .tree-file-btn i {
            color: #64748b;
        }
        .tree-file-download {
            color: #64748b;
            border-radius: 4px;
            padding: 4px 6px;
            opacity: 0;
        }
        .tree-row:hover .tree-file-download,
        .tree-file-download:focus {
            opacity: 1;
        }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .path-box {
            font-family: monospace;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 12px;
            word-break: break-all;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            margin-bottom: 10px;
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border-bottom: 1px solid #e2e8f0;
            padding: 8px;
            text-align: left;
            font-size: 14px;
        }
        .op-links a,
        .op-links button {
            margin-right: 8px;
            border: none;
            background: none;
            color: #2563eb;
            cursor: pointer;
            padding: 0;
            font-size: 13px;
        }
        .message-box {
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            display: none;
        }
        .message-success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .message-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .path-tools {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
        }
        .path-breadcrumb {
            margin: 8px 0 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 13px;
        }
        .path-breadcrumb button {
            border: none;
            background: #eef2ff;
            color: #1e40af;
            padding: 4px 8px;
            border-radius: 999px;
            cursor: pointer;
        }
        .path-breadcrumb .current {
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: 600;
        }
        .is-loading {
            opacity: 0.65;
            pointer-events: none;
        }
        @media (max-width: 980px) {
            .trial-shell {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        {% include 'core/partials/navbar.html' %}
        <main class="app-main">
            <div class="app-content">
                <div class="container">
                    <div class="toolbar" style="margin-top: 12px;">
                        <div>
                            <div style="font-size:13px;color:#64748b;margin-bottom:6px;">
                                <a href="{% url 'project_list' %}" style="color:#64748b;text-decoration:none;">课题列表</a>
                                <span style="margin:0 6px;">/</span>
                                <a href="{% url 'project_detail' project.project_id %}" style="color:#64748b;text-decoration:none;">课题详情</a>
                                <span style="margin:0 6px;">/</span>
                                <strong style="color:#334155;">Web试用</strong>
                            </div>
                            <h2 style="margin: 0;">Web文件管理试用</h2>
                            <div style="color:#64748b; margin-top:4px;">项目：{{ project.name }}（{{ project.project_id }}）</div>
                        </div>
                        <div>
                            <a href="{% url 'project_detail' project.project_id %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i>
                                返回详情页
                            </a>
                        </div>
                    </div>

                    <div id="messageBox" class="message-box"></div>

                    <div class="trial-shell">
                        <section class="panel">
                            <h3><i class="fas fa-folder-tree"></i> 目录树</h3>
                            <button id="refreshTreeBtn" class="btn btn-outline-primary btn-sm" type="button">
                                <i class="fas fa-rotate"></i> 刷新
                            </button>
                            <p class="tree-help">点击箭头逐级展开目录；点击文件夹可查看内容，点击文件可直接预览。</p>
                            <div id="treeContainer" role="tree" aria-label="课题材料目录树"></div>
                        </section>

                        <section class="panel">
                            <h3><i class="fas fa-folder-open"></i> 当前目录</h3>
                            <div class="path-tools">
                                <div class="path-box" id="currentPathText">/</div>
                                <button id="upLevelBtn" type="button" class="btn btn-outline-secondary btn-sm">上一级</button>
                            </div>
                            <div id="pathBreadcrumb" class="path-breadcrumb"></div>

                            <form id="uploadForm" class="form-row">
                                <input id="uploadFiles" type="file" name="files" multiple required>
                                <button type="submit" class="btn btn-primary btn-sm">上传</button>
                            </form>

                            <form id="mkdirForm" class="form-row">
                                <input id="newFolderName" type="text" placeholder="新文件夹名称" required>
                                <button type="submit" class="btn btn-outline-primary btn-sm">新建文件夹</button>
                            </form>

                            <div class="table-wrap">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>名称</th>
                                            <th>类型</th>
                                            <th>大小</th>
                                            <th>修改时间</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="itemsBody"></tbody>
                                </table>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const endpoints = {
            tree: "{% url 'get_file_tree' project.project_id %}",
            upload: "{% url 'file_action' project.project_id 'upload' %}",
            mkdir: "{% url 'file_action' project.project_id 'create_folder' %}",
            del: "{% url 'file_action' project.project_id 'delete' %}",
            rename: "{% url 'file_action' project.project_id 'rename' %}",
            previewBase: "{% url 'file_action' project.project_id 'preview' %}",
            downloadBase: "{% url 'file_action' project.project_id 'download' %}"
        };

        let treeData = [];
        let currentPath = "";
        let isLoading = false;
        const expandedPaths = new Set();

        const treeContainer = document.getElementById("treeContainer");
        const itemsBody = document.getElementById("itemsBody");
        const currentPathText = document.getElementById("currentPathText");
        const messageBox = document.getElementById("messageBox");
        const uploadForm = document.getElementById("uploadForm");
        const uploadFiles = document.getElementById("uploadFiles");
        const mkdirForm = document.getElementById("mkdirForm");
        const newFolderName = document.getElementById("newFolderName");
        const upLevelBtn = document.getElementById("upLevelBtn");
        const pathBreadcrumb = document.getElementById("pathBreadcrumb");

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) {
                return parts.pop().split(";").shift();
            }
            return "";
        }

        function showMessage(msg, isError = false) {
            messageBox.style.display = "block";
            messageBox.className = "message-box " + (isError ? "message-error" : "message-success");
            messageBox.textContent = msg;
            setTimeout(() => {
                messageBox.style.display = "none";
            }, 2600);
        }

        function setLoading(loading) {
            isLoading = loading;
            document.body.classList.toggle("is-loading", loading);
        }

        function normalizePath(path) {
            return (path || "").replace(/\\/g, "/");
        }

        function renderBreadcrumb() {
            const segs = normalizePath(currentPath).split("/").filter(Boolean);
            const parts = [{ name: "根目录", path: "" }];
            let acc = "";
            for (const seg of segs) {
                acc = acc ? `${acc}/${seg}` : seg;
                parts.push({ name: seg, path: acc });
            }
            pathBreadcrumb.innerHTML = parts.map((p, idx) => {
                const cls = idx === parts.length - 1 ? "current" : "";
                return `<button type="button" class="${cls}" onclick="jumpToPath('${(p.path || "").replace(/'/g, "\\'")}')">${p.name}</button>`;
            }).join("");
            upLevelBtn.disabled = segs.length === 0;
        }

        function findFolderNode(nodes, targetPath) {
            const target = normalizePath(targetPath);
            for (const node of nodes) {
                if (node.type === "folder") {
                    if (normalizePath(node.path) === target) {
                        return node;
                    }
                    if (node.children && node.children.length) {
                        const found = findFolderNode(node.children, target);
                        if (found) return found;
                    }
                }
            }
            return null;
        }

        function prepareTreeNodes(nodes) {
            return (nodes || []).map((node) => {
                node.children = Array.isArray(node.children) ? prepareTreeNodes(node.children) : [];
                if (node.type === "folder") {
                    node._loaded = node.children.length > 0 || !node.has_children;
                    node._loading = false;
                }
                return node;
            });
        }

        function getFolderMeta(node) {
            const fileCount = Number.isFinite(Number(node.file_count)) ? Number(node.file_count) : null;
            const folderCount = Number.isFinite(Number(node.folder_count)) ? Number(node.folder_count) : null;
            if (fileCount === null || folderCount === null) return "";
            if (fileCount + folderCount === 0) return "（空）";
            return `（${fileCount} 文件，${folderCount} 文件夹）`;
        }

        function renderTree(nodes) {
            const ul = document.createElement("ul");
            ul.className = "tree-list";
            ul.setAttribute("role", "group");

            for (const node of nodes) {
                const li = document.createElement("li");
                li.className = "tree-item";
                li.setAttribute("role", "treeitem");

                const row = document.createElement("div");
                row.className = "tree-row";

                if (node.type === "folder") {
                    const nodePath = normalizePath(node.path);
                    const hasChildren = Boolean(node.has_children || node.children.length);
                    const isExpanded = expandedPaths.has(nodePath);

                    if (hasChildren) {
                        const toggle = document.createElement("button");
                        toggle.className = "tree-toggle";
                        toggle.type = "button";
                        toggle.setAttribute("aria-label", `${isExpanded ? "收起" : "展开"}${node.name}`);
                        toggle.setAttribute("aria-expanded", String(isExpanded));
                        toggle.innerHTML = node._loading
                            ? '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i>'
                            : `<i class="fas fa-chevron-${isExpanded ? "down" : "right"}" aria-hidden="true"></i>`;
                        toggle.disabled = Boolean(node._loading);
                        toggle.addEventListener("click", () => toggleFolderNode(node));
                        row.appendChild(toggle);
                    } else {
                        const placeholder = document.createElement("span");
                        placeholder.className = "tree-toggle-placeholder";
                        row.appendChild(placeholder);
                    }

                    const btn = document.createElement("button");
                    btn.className = "tree-folder-btn" + (normalizePath(currentPath) === nodePath ? " active" : "");
                    btn.type = "button";

                    const folderIcon = document.createElement("i");
                    folderIcon.className = `fas ${isExpanded ? "fa-folder-open" : "fa-folder"}`;
                    folderIcon.setAttribute("aria-hidden", "true");
                    btn.appendChild(folderIcon);

                    const folderName = document.createElement("span");
                    folderName.className = "tree-folder-name";
                    folderName.textContent = node.name;
                    btn.appendChild(folderName);

                    const meta = document.createElement("span");
                    meta.className = "tree-folder-meta";
                    meta.textContent = getFolderMeta(node);
                    if (!node.has_children) meta.classList.add("is-empty");
                    if (meta.textContent) {
                        btn.appendChild(meta);
                    }

                    btn.addEventListener("click", () => selectFolderNode(node));
                    row.appendChild(btn);
                    li.appendChild(row);
                    if (isExpanded && node._loaded && node.children.length) {
                        li.appendChild(renderTree(node.children));
                    }
                } else {
                    const placeholder = document.createElement("span");
                    placeholder.className = "tree-toggle-placeholder";
                    row.appendChild(placeholder);

                    const previewLink = document.createElement("a");
                    previewLink.className = "tree-file-btn";
                    previewLink.href = buildPreviewLink(node.path);
                    previewLink.target = "_blank";
                    previewLink.rel = "noopener";
                    previewLink.title = `预览 ${node.name}`;
                    previewLink.innerHTML = '<i class="fas fa-file" aria-hidden="true"></i>';
                    const fileName = document.createElement("span");
                    fileName.textContent = node.name;
                    previewLink.appendChild(fileName);
                    row.appendChild(previewLink);

                    const downloadLink = document.createElement("a");
                    downloadLink.className = "tree-file-download";
                    downloadLink.href = buildDownloadLink(node.path);
                    downloadLink.title = `下载 ${node.name}`;
                    downloadLink.setAttribute("aria-label", `下载 ${node.name}`);
                    downloadLink.innerHTML = '<i class="fas fa-download" aria-hidden="true"></i>';
                    row.appendChild(downloadLink);
                    li.appendChild(row);
                }
                ul.appendChild(li);
            }
            return ul;
        }

        function renderTreePanel() {
            treeContainer.innerHTML = "";
            const rootBar = document.createElement("div");
            rootBar.className = "tree-row";
            rootBar.style.marginBottom = "6px";
            rootBar.innerHTML = `<span class="tree-toggle-placeholder"></span><button type="button" class="tree-folder-btn ${currentPath === "" ? "active" : ""}"><i class="fas fa-folder-open" aria-hidden="true"></i><span>根目录</span></button>`;
            rootBar.querySelector("button").addEventListener("click", goRoot);
            treeContainer.appendChild(rootBar);
            treeContainer.appendChild(renderTree(treeData));
        }

        async function loadFolderChildren(node, showLoading = true) {
            if (!node || node.type !== "folder" || node._loaded) return true;
            node._loading = true;
            if (showLoading) renderTreePanel();
            try {
                const url = `${endpoints.tree}?path=${encodeURIComponent(node.path || "")}`;
                const resp = await fetch(url, {
                    method: "GET",
                    headers: { "X-Requested-With": "XMLHttpRequest" }
                });
                const data = await resp.json();
                if (!resp.ok || !data.success) {
                    throw new Error(data.message || `HTTP ${resp.status}`);
                }
                node.children = prepareTreeNodes(data.file_tree || []);
                node._loaded = true;
                node.has_children = node.children.length > 0;
                if (data.stats) {
                    node.file_count = data.stats.file_count;
                    node.folder_count = data.stats.folder_count;
                }
                return true;
            } catch (error) {
                showMessage(`目录加载失败：${error.message || error}`, true);
                return false;
            } finally {
                node._loading = false;
            }
        }

        async function toggleFolderNode(node) {
            const nodePath = normalizePath(node.path);
            if (expandedPaths.has(nodePath)) {
                expandedPaths.delete(nodePath);
                renderTreePanel();
                return;
            }
            expandedPaths.add(nodePath);
            const loaded = await loadFolderChildren(node);
            if (!loaded) expandedPaths.delete(nodePath);
            renderTreePanel();
        }

        async function selectFolderNode(node) {
            currentPath = node.path || "";
            if (node.has_children) {
                expandedPaths.add(normalizePath(node.path));
                await loadFolderChildren(node);
            }
            refreshPanel();
        }

        async function ensureFolderPath(path, expandFolder = false, showLoading = true) {
            const segments = normalizePath(path).split("/").filter(Boolean);
            let nodes = treeData;
            let node = null;
            let accumulatedPath = "";
            for (const segment of segments) {
                accumulatedPath = accumulatedPath ? `${accumulatedPath}/${segment}` : segment;
                node = nodes.find((candidate) =>
                    candidate.type === "folder" && normalizePath(candidate.path) === accumulatedPath
                );
                if (!node) return null;
                if (expandFolder) expandedPaths.add(accumulatedPath);
                const loaded = await loadFolderChildren(node, showLoading);
                if (!loaded) return null;
                nodes = node.children;
            }
            return node;
        }

        function buildPreviewLink(path) {
            return `${endpoints.previewBase}?path=${encodeURIComponent(path)}`;
        }

        function buildDownloadLink(path) {
            return `${endpoints.downloadBase}?path=${encodeURIComponent(path)}`;
        }

        async function deleteItem(path, name) {
            if (!confirm(`确定删除：${name} ？`)) return;
            const body = new URLSearchParams();
            body.append("path", path);
            try {
                const resp = await fetch(endpoints.del, {
                    method: "POST",
                    headers: {
                        "X-Requested-With": "XMLHttpRequest",
                        "X-CSRFToken": getCookie("csrftoken"),
                        "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
                    },
                    body: body.toString()
                });
                const data = await resp.json();
                if (!resp.ok || !data.success) {
                    showMessage(data.message || "删除失败", true);
                    return;
                }
                showMessage(data.message || "删除完成");
                await loadTree();
            } catch (err) {
                showMessage(`删除失败: ${err}`, true);
            }
        }

        async function renameItem(path, oldName) {
            const newName = prompt("请输入新名称：", oldName || "");
            if (!newName || newName.trim() === "" || newName.trim() === oldName) return;
            const body = new URLSearchParams();
            body.append("path", path);
            body.append("new_name", newName.trim());
            try {
                const resp = await fetch(endpoints.rename, {
                    method: "POST",
                    headers: {
                        "X-Requested-With": "XMLHttpRequest",
                        "X-CSRFToken": getCookie("csrftoken"),
                        "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
                    },
                    body: body.toString()
                });
                const data = await resp.json();
                if (!resp.ok || !data.success) {
                    showMessage(data.message || "重命名失败", true);
                    return;
                }
                showMessage(data.message || "重命名成功");
                await loadTree();
            } catch (err) {
                showMessage(`重命名失败: ${err}`, true);
            }
        }

        function renderItems(folderNode) {
            const rows = [];
            const children = folderNode ? (folderNode.children || []) : treeData;
            children.forEach((item) => {
                const typeText = item.type === "folder" ? "文件夹" : "文件";
                const sizeText = item.type === "file" ? (item.size || "-") : "-";
                const timeText = item.type === "file" ? (item.modified_time || "-") : "-";
                const safeName = item.name || "(未命名)";

                let ops = "";
                if (item.type === "folder") {
                    ops += `<button type="button" onclick="enterFolder('${(item.path || '').replace(/'/g, "\\'")}')">进入</button>`;
                } else {
                    ops += `<a href="${buildPreviewLink(item.path)}" target="_blank">预览</a>`;
                    ops += `<a href="${buildDownloadLink(item.path)}">下载</a>`;
                }
                ops += `<button type="button" onclick="renameByPath('${(item.path || '').replace(/'/g, "\\'")}', '${safeName.replace(/'/g, "\\'")}')">重命名</button>`;
                ops += `<button type="button" onclick="deleteByPath('${(item.path || '').replace(/'/g, "\\'")}', '${safeName.replace(/'/g, "\\'")}')">删除</button>`;

                rows.push(`
                    <tr>
                        <td>${safeName}</td>
                        <td>${typeText}</td>
                        <td>${sizeText}</td>
                        <td>${timeText}</td>
                        <td class="op-links">${ops}</td>
                    </tr>
                `);
            });

            itemsBody.innerHTML = rows.length ? rows.join("") : `<tr><td colspan="5" style="text-align:center;color:#64748b;">当前目录暂无文件</td></tr>`;
        }

        function refreshPanel() {
            const shownPath = currentPath ? `/${currentPath}` : "/";
            currentPathText.textContent = shownPath;
            renderBreadcrumb();

            renderTreePanel();

            const folderNode = currentPath ? findFolderNode(treeData, currentPath) : { children: treeData };
            renderItems(folderNode);
        }

        async function loadTree() {
            setLoading(true);
            try {
                const resp = await fetch(endpoints.tree, { method: "GET" });
                const data = await resp.json();
                if (!data.success) {
                    showMessage("加载文件树失败", true);
                    return;
                }
                const pathToRestore = currentPath;
                treeData = prepareTreeNodes(data.file_tree || []);
                expandedPaths.clear();
                if (pathToRestore) {
                    const restoredNode = await ensureFolderPath(pathToRestore, true, false);
                    if (!restoredNode) currentPath = "";
                }
                refreshPanel();
            } catch (e) {
                showMessage(`加载失败: ${e}`, true);
            } finally {
                setLoading(false);
            }
        }

        uploadForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!uploadFiles.files.length) {
                showMessage("请选择文件", true);
                return;
            }
            const formData = new FormData();
            for (const f of uploadFiles.files) {
                formData.append("files", f);
            }
            formData.append("target_path", currentPath);

            try {
                setLoading(true);
                const resp = await fetch(endpoints.upload, {
                    method: "POST",
                    headers: {
                        "X-Requested-With": "XMLHttpRequest",
                        "X-CSRFToken": getCookie("csrftoken")
                    },
                    body: formData
                });
                const data = await resp.json();
                if (!data.success) {
                    showMessage(data.message || "上传失败", true);
                    return;
                }
                uploadFiles.value = "";
                showMessage(data.message || "上传成功");
                await loadTree();
            } catch (err) {
                showMessage(`上传失败: ${err}`, true);
            } finally {
                setLoading(false);
            }
        });

        mkdirForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = (newFolderName.value || "").trim();
            if (!name) {
                showMessage("请输入文件夹名称", true);
                return;
            }

            const body = new URLSearchParams();
            body.append("folder_name", name);
            body.append("parent_path", currentPath);

            try {
                setLoading(true);
                const resp = await fetch(endpoints.mkdir, {
                    method: "POST",
                    headers: {
                        "X-Requested-With": "XMLHttpRequest",
                        "X-CSRFToken": getCookie("csrftoken"),
                        "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
                    },
                    body: body.toString()
                });
                const data = await resp.json();
                if (!data.success) {
                    showMessage(data.message || "创建失败", true);
                    return;
                }
                newFolderName.value = "";
                showMessage(data.message || "创建成功");
                await loadTree();
            } catch (err) {
                showMessage(`创建失败: ${err}`, true);
            } finally {
                setLoading(false);
            }
        });

        document.getElementById("refreshTreeBtn").addEventListener("click", loadTree);

        function goRoot() {
            currentPath = "";
            refreshPanel();
        }

        async function enterFolder(path) {
            const targetPath = path || "";
            if (!targetPath) {
                goRoot();
                return;
            }
            const node = await ensureFolderPath(targetPath, true);
            if (!node) {
                showMessage("无法打开该文件夹，请刷新目录树后重试。", true);
                return;
            }
            currentPath = targetPath;
            refreshPanel();
        }

        async function goUp() {
            const segs = normalizePath(currentPath).split("/").filter(Boolean);
            segs.pop();
            await enterFolder(segs.join("/"));
        }

        async function jumpToPath(path) {
            await enterFolder(path || "");
        }

        function deleteByPath(path, name) {
            deleteItem(path, name);
        }

        function renameByPath(path, name) {
            renameItem(path, name);
        }

        window.goRoot = goRoot;
        window.enterFolder = enterFolder;
        window.deleteByPath = deleteByPath;
        window.renameByPath = renameByPath;
        window.jumpToPath = jumpToPath;
        upLevelBtn.addEventListener("click", goUp);

        loadTree();
    </script>
</body>
</html>
