{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - 科研课题管理系统</title>
    <link rel="stylesheet" href="{% static 'core/css/design-system.css' %}?v=2.0">
    <link rel="stylesheet" href="{% static 'core/css/navigation.css' %}?v=2.0">
    <link rel="stylesheet" href="{% static 'core/css/layout.css' %}?v=2.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>.account-card{max-width:680px;margin:40px auto}.account-card form p{margin-bottom:18px}.account-card label{display:block;font-weight:600;margin-bottom:6px}.account-card input{width:100%;padding:10px 12px;border:1px solid var(--border-light);border-radius:10px}.helptext{display:block;color:var(--text-secondary);font-size:13px;margin-top:5px}.errorlist{color:var(--danger-color)}</style>
</head>
<body>
<div class="app-layout">
    {% include 'core/partials/navbar.html' %}
    <main class="app-main"><div class="container"><div class="card account-card"><div class="card-header"><h3><i class="fas fa-key"></i> 修改密码</h3></div><div class="card-body">
        <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">保存新密码</button></form>
    </div></div></div></main>
</div>
</body>
</html>
