{% extends 'core/base.html' %}

{% block title %}修改密码 - 科研课题管理系统{% endblock %}

{% block extra_head %}
<style>
    .account-card { max-width: 680px; margin: 40px auto; }
    .account-card form p { margin-bottom: 18px; }
    .account-card label { display: block; font-weight: 600; margin-bottom: 6px; }
    .account-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--border-light); border-radius: 10px; }
    .helptext { display: block; color: var(--text-secondary); font-size: 13px; margin-top: 5px; }
    .errorlist { color: var(--error-color); }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="card account-card">
        <div class="card-header"><h1 class="h3"><i class="fas fa-key" aria-hidden="true"></i> 修改密码</h1></div>
        <div class="card-body"><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">保存新密码</button></form></div>
    </div>
</div>
{% endblock %}
