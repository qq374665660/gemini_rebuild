<div class="page-header">
    <div class="container">
        <div class="page-header-content">
            <div>
                <h1 class="page-title">
                    {% if page_icon %}<i class="{{ page_icon }}" aria-hidden="true"></i>{% endif %}
                    {{ page_title }}
                </h1>
                {% if page_subtitle %}<p class="page-subtitle">{{ page_subtitle }}</p>{% endif %}
            </div>
        </div>
    </div>
</div>
